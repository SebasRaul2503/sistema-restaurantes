<div class="login-wrap">
  <div class="login-card card">
    <div class="login-head">
      @if (settings()?.logoUrl) {
        <img class="logo" [src]="settings()!.logoUrl" alt="Logo" />
      } @else {
        <div class="logo-mark">{{ (settings()?.name || 'R')[0] }}</div>
      }
      <h1>{{ settings()?.name || 'Gestión de Restaurante' }}</h1>
      <p class="muted">Inicie sesión para continuar</p>
    </div>

    <form (ngSubmit)="submit()">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          class="input"
          type="email"
          autocomplete="username"
          placeholder="correo@restaurante.pe"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          class="input"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
        />
      </div>

      @if (error()) {
        <p class="field-error">{{ error() }}</p>
      }

      <button class="btn btn-primary btn-block" type="submit" [disabled]="loading()">
        {{ loading() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
